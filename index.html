<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIEW Conference 2026 Schedule</title>
  
  <!-- Compiled Tailwind CSS for Production -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwindcss.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .active-tab {
      background-color: #4f46e5 !important;
      color: #ffffff !important;
      border-color: #6366f1 !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">
          VIEW Conference 2026
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">October 12 - 16, 2026 • Turin, Italy</p>
      </div>

      <!-- Search Input -->
      <div class="w-full md:w-72">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search talk, speaker, track..." 
          class="w-full bg-slate-800 text-slate-100 text-sm rounded-lg px-3.5 py-2 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent placeholder-slate-500"
          oninput="handleFilterChange()"
        >
      </div>
    </div>

    <!-- Day Navigation Bar -->
    <div class="bg-slate-900/90 border-t border-slate-800/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center space-x-2 py-2 overflow-x-auto text-xs sm:text-sm scrollbar-none">
        <button onclick="setDateFilter('all')" id="tab-all" class="date-tab active-tab px-3 py-1.5 rounded-lg border border-slate-700 font-semibold transition-all whitespace-nowrap">
          All Days
        </button>
        <button onclick="setDateFilter('2026-10-12')" id="tab-2026-10-12" class="date-tab px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 font-medium hover:bg-slate-700 transition-all whitespace-nowrap">
          Mon, Oct 12
        </button>
        <button onclick="setDateFilter('2026-10-13')" id="tab-2026-10-13" class="date-tab px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 font-medium hover:bg-slate-700 transition-all whitespace-nowrap">
          Tue, Oct 13
        </button>
        <button onclick="setDateFilter('2026-10-14')" id="tab-2026-10-14" class="date-tab px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 font-medium hover:bg-slate-700 transition-all whitespace-nowrap">
          Wed, Oct 14
        </button>
        <button onclick="setDateFilter('2026-10-15')" id="tab-2026-10-15" class="date-tab px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 font-medium hover:bg-slate-700 transition-all whitespace-nowrap">
          Thu, Oct 15
        </button>
        <button onclick="setDateFilter('2026-10-16')" id="tab-2026-10-16" class="date-tab px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 font-medium hover:bg-slate-700 transition-all whitespace-nowrap">
          Fri, Oct 16
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    
    <!-- Count / Info Bar -->
    <div class="flex items-center justify-between mb-6 text-sm text-slate-400">
      <span id="event-count">Loading schedule...</span>
    </div>

    <!-- Events Container Grid -->
    <div id="events-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full py-16 text-center text-slate-500">
        <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Fetching latest VIEW Conference schedule...
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 border-t border-slate-800 py-6 mt-12 text-center text-xs text-slate-500">
    <p>VIEW Conference Schedule Viewer • Data updated dynamically from official VIEW site</p>
  </footer>

  <!-- Application Logic -->
  <script>
    let allEvents = [];
    let selectedDate = 'all';

    async function initApp() {
      try {
        // Fetch schedule.json relative path with cache buster
        const response = await fetch('./schedule.json?v=' + Date.now());
        if (!response.ok) {
          throw new Error(`HTTP Error Status: ${response.status}`);
        }
        
        allEvents = await response.json();
        console.log(`Loaded ${allEvents.length} events successfully.`);
        
        // Initial render
        handleFilterChange();
      } catch (error) {
        console.error("Failed to load schedule.json:", error);
        const container = document.getElementById('events-container');
        if (container) {
          container.innerHTML = `
            <div class="col-span-full bg-red-900/20 border border-red-800 rounded-xl p-8 text-center text-red-400">
              <h3 class="text-lg font-bold mb-2">Failed to load schedule</h3>
              <p class="text-sm">Unable to parse schedule.json. Please check repository updates.</p>
            </div>
          `;
        }
      }
    }

    function setDateFilter(date) {
      selectedDate = date;
      
      // Update Tab CSS
      document.querySelectorAll('.date-tab').forEach(tab => {
        tab.classList.remove('active-tab');
        tab.classList.add('bg-slate-800', 'text-slate-300');
      });

      const activeBtn = document.getElementById(`tab-${date}`);
      if (activeBtn) {
        activeBtn.classList.add('active-tab');
        activeBtn.classList.remove('bg-slate-800', 'text-slate-300');
      }

      handleFilterChange();
    }

    function handleFilterChange() {
      const searchQuery = (document.getElementById('search-input')?.value || '').toLowerCase().trim();

      const filtered = allEvents.filter(event => {
        // Match Date
        const matchesDate = (selectedDate === 'all') || (event.date === selectedDate);
        
        // Match Search Query
        const matchesSearch = !searchQuery || 
          (event.title && event.title.toLowerCase().includes(searchQuery)) ||
          (event.speaker && event.speaker.toLowerCase().includes(searchQuery)) ||
          (event.track && event.track.toLowerCase().includes(searchQuery)) ||
          (event.location && event.location.toLowerCase().includes(searchQuery));

        return matchesDate && matchesSearch;
      });

      renderEvents(filtered);
    }

    function renderEvents(events) {
      const container = document.getElementById('events-container');
      const countEl = document.getElementById('event-count');

      if (countEl) {
        countEl.textContent = `Showing ${events.length} session${events.length === 1 ? '' : 's'}`;
      }

      if (!container) return;

      if (events.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-500">
            No sessions match your search criteria.
          </div>
        `;
        return;
      }

      container.innerHTML = events.map(event => `
        <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700/80 hover:border-indigo-500/80 transition-all flex flex-col justify-between shadow-lg">
          <div class="relative h-44 overflow-hidden bg-slate-900">
            <img 
              src="${event.imageUrl}" 
              alt="${event.title}" 
              class="w-full h-full object-cover" 
              onerror="this.onerror=null; this.src='https://s3.amazonaws.com/view-conference-www/assets/article/2026/08/21/bradbirdbanner2_688x387.jpg';"
            >
            <span class="absolute top-3 right-3 bg-indigo-600/90 backdrop-blur-md text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase tracking-wider shadow">
              ${event.track || 'Session'}
            </span>
          </div>
          
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <div class="text-xs font-semibold text-indigo-400 mb-1.5 flex items-center gap-1.5">
                <span>🗓️ ${event.date}</span>
                <span>•</span>
                <span>⏰ ${event.startTime} - ${event.endTime}</span>
              </div>
              <h3 class="text-base font-bold text-slate-100 mb-2 leading-snug line-clamp-2">
                ${event.title}
              </h3>
              <p class="text-xs text-slate-400 mb-4 line-clamp-2">
                👤 ${event.speaker}
              </p>
            </div>

            <div class="pt-3 border-t border-slate-700/60 flex items-center justify-between text-xs text-slate-400">
              <span class="truncate max-w-[180px]">📍 ${event.location}</span>
              <a 
                href="${event.url}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="text-indigo-400 hover:text-indigo-300 font-semibold whitespace-nowrap ml-2"
              >
                Details →
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
