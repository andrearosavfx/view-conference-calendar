<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIEW Conference 2026 Schedule</title>

  <!-- Tailwind CSS Play CDN (Ensures all modern utility classes compile properly) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fail-safe inline styles to guarantee dark theme, flexbox, and grid work even if CDN is delayed -->
  <style>
    /* Critical base styles to prevent layout explosion */
    html, body {
      background-color: #0f172a !important;
      color: #f8fafc !important;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Container Grid Lock */
    #events-grid {
      display: grid !important;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)) !important;
      gap: 1.5rem !important;
    }

    /* Tab and Pill Active State */
    .active-pill {
      background-color: #6366f1 !important;
      color: #ffffff !important;
      border-color: #818cf8 !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-900 text-slate-100 antialiased">

  <!-- Header -->
  <header class="bg-slate-800/90 border-b border-slate-700/80 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        
        <!-- Brand Title -->
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center font-black text-xl text-white shadow-lg">
            V
          </div>
          <div>
            <h1 class="text-xl font-bold text-white">
              VIEW Conference 2026
            </h1>
            <p class="text-xs text-slate-400">Official Interactive Event Schedule</p>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full md:w-80">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search talk, speaker, location..." 
            class="w-full bg-slate-900 text-sm text-slate-100 placeholder-slate-500 rounded-xl px-4 py-2.5 border border-slate-700 focus:outline-none focus:border-indigo-500 transition-all"
            oninput="handleFilterChange()"
          >
          <span class="absolute right-3.5 top-2.5 text-slate-500 text-sm">🔍</span>
        </div>

      </div>
    </div>

    <!-- Navigation & Filter Bar -->
    <div class="bg-slate-900/60 border-t border-slate-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col gap-3">
        
        <!-- Day Selector Tabs -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-1 text-xs font-semibold">
          <button onclick="setDateFilter('all')" id="date-all" class="date-tab active-pill px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
            All Days
          </button>
          <button onclick="setDateFilter('2026-10-12')" id="date-2026-10-12" class="date-tab px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
            Mon Oct 12
          </button>
          <button onclick="setDateFilter('2026-10-13')" id="date-2026-10-13" class="date-tab px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
            Tue Oct 13
          </button>
          <button onclick="setDateFilter('2026-10-14')" id="date-2026-10-14" class="date-tab px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
            Wed Oct 14
          </button>
          <button onclick="setDateFilter('2026-10-15')" id="date-2026-10-15" class="date-tab px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
            Thu Oct 15
          </button>
          <button onclick="setDateFilter('2026-10-16')" id="date-2026-10-16" class="date-tab px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
            Fri Oct 16
          </button>
        </div>

        <!-- Track & Location Filters -->
        <div class="flex flex-wrap items-center justify-between gap-3 text-xs">
          
          <div class="flex items-center space-x-2 overflow-x-auto">
            <span class="text-slate-400 font-medium mr-1">Track:</span>
            <button onclick="setTrackFilter('all')" id="track-all" class="track-pill active-pill px-3 py-1 rounded-full border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
              All Tracks
            </button>
            <button onclick="setTrackFilter('Keynote')" id="track-Keynote" class="track-pill px-3 py-1 rounded-full border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
              Keynotes
            </button>
            <button onclick="setTrackFilter('VFX')" id="track-VFX" class="track-pill px-3 py-1 rounded-full border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
              VFX
            </button>
            <button onclick="setTrackFilter('Animation')" id="track-Animation" class="track-pill px-3 py-1 rounded-full border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
              Animation
            </button>
            <button onclick="setTrackFilter('AI & Tech')" id="track-AI & Tech" class="track-pill px-3 py-1 rounded-full border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
              AI & Tech
            </button>
          </div>

          <div class="flex items-center space-x-2">
            <span class="text-slate-400 font-medium">Location:</span>
            <select 
              id="location-select" 
              onchange="handleFilterChange()"
              class="bg-slate-800 text-slate-200 text-xs rounded-lg px-3 py-1.5 border border-slate-700 focus:outline-none focus:border-indigo-500"
            >
              <option value="all">All Locations</option>
              <option value="OGR - FUCINE">OGR - FUCINE</option>
              <option value="OGR - BINARIO3">OGR - BINARIO3</option>
              <option value="OGR - MEZZANINO">OGR - MEZZANINO</option>
              <option value="OGR - SOPPALCO">OGR - SOPPALCO</option>
              <option value="OGR - CINEMA MASSIMO">OGR - CINEMA MASSIMO</option>
            </select>
          </div>

        </div>

      </div>
    </div>
  </header>

  <!-- Main Grid Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    
    <div class="flex items-center justify-between mb-6 text-sm text-slate-400">
      <div id="results-count">Loading schedule...</div>
    </div>

    <div id="events-grid">
      <div class="col-span-full py-20 text-center text-slate-500">
        <p>Loading VIEW Conference schedule...</p>
      </div>
    </div>
  </main>

  <footer class="bg-slate-800/40 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    VIEW Conference Calendar • Built for GitHub Pages
  </footer>

  <script>
    let eventsData = [];
    let activeDate = 'all';
    let activeTrack = 'all';

    async function loadSchedule() {
      try {
        const response = await fetch('./schedule.json?v=' + Date.now());
        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}`);
        }
        eventsData = await response.json();
        handleFilterChange();
      } catch (err) {
        console.error("Error loading schedule.json:", err);
        const grid = document.getElementById('events-grid');
        if (grid) {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1;" class="p-8 rounded-xl bg-red-900/20 border border-red-800 text-center text-red-400">
              Failed to load schedule.json. Check browser console for details.
            </div>
          `;
        }
      }
    }

    function setDateFilter(date) {
      activeDate = date;
      document.querySelectorAll('.date-tab').forEach(el => el.classList.remove('active-pill'));
      const activeEl = document.getElementById(`date-${date}`);
      if (activeEl) activeEl.classList.add('active-pill');
      handleFilterChange();
    }

    function setTrackFilter(track) {
      activeTrack = track;
      document.querySelectorAll('.track-pill').forEach(el => el.classList.remove('active-pill'));
      const activeEl = document.getElementById(`track-${track}`);
      if (activeEl) activeEl.classList.add('active-pill');
      handleFilterChange();
    }

    function handleFilterChange() {
      const query = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
      const selectedLocation = document.getElementById('location-select')?.value || 'all';

      const filtered = eventsData.filter(event => {
        const matchDate = (activeDate === 'all') || (event.date === activeDate);
        const matchTrack = (activeTrack === 'all') || (event.track === activeTrack);
        const matchLocation = (selectedLocation === 'all') || (event.location === selectedLocation);
        
        const matchSearch = !query || 
          (event.title && event.title.toLowerCase().includes(query)) ||
          (event.speaker && event.speaker.toLowerCase().includes(query)) ||
          (event.location && event.location.toLowerCase().includes(query));

        return matchDate && matchTrack && matchLocation && matchSearch;
      });

      renderGrid(filtered);
    }

    function renderGrid(events) {
      const grid = document.getElementById('events-grid');
      const countEl = document.getElementById('results-count');

      if (countEl) {
        countEl.textContent = `Showing ${events.length} session${events.length === 1 ? '' : 's'}`;
      }

      if (!grid) return;

      if (events.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1;" class="py-16 text-center text-slate-500">
            No events found matching your filter options.
          </div>
        `;
        return;
      }

      grid.innerHTML = events.map(event => `
        <div class="bg-slate-800/90 rounded-2xl overflow-hidden border border-slate-700/80 hover:border-indigo-500/80 transition-all duration-200 flex flex-col justify-between shadow-lg group" style="min-height: 380px;">
          
          <div class="relative h-48 bg-slate-900 overflow-hidden">
            <img 
              src="${event.imageUrl}" 
              alt="${event.title}" 
              class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-300"
              onerror="this.onerror=null; this.src='https://s3.amazonaws.com/view-conference-www/assets/article/2026/08/21/bradbirdbanner2_688x387.jpg';"
            >
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-80"></div>
            
            <span class="absolute top-3 right-3 bg-indigo-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider shadow">
              ${event.track || 'Session'}
            </span>
          </div>

          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <div class="text-xs font-semibold text-indigo-400 mb-2 flex items-center gap-2">
                <span>📅 ${event.date}</span>
                <span>•</span>
                <span>⏰ ${event.startTime} - ${event.endTime}</span>
              </div>

              <h3 class="text-base font-bold text-slate-100 mb-2 leading-snug group-hover:text-indigo-300 transition-colors">
                ${event.title}
              </h3>

              <p class="text-xs text-slate-400 mb-4 font-medium">
                👤 ${event.speaker}
              </p>
            </div>

            <div class="pt-3 border-t border-slate-700/60 flex items-center justify-between text-xs text-slate-400">
              <span class="truncate max-w-[190px] text-slate-300 font-medium">📍 ${event.location || 'OGR Torino'}</span>
              <a 
                href="${event.url}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="text-indigo-400 hover:text-indigo-300 font-semibold flex items-center gap-1 transition-colors"
              >
                <span>Details</span>
                <span>→</span>
              </a>
            </div>
          </div>

        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', loadSchedule);
  </script>
</body>
</html>
