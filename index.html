<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIEW Conference 2026 Schedule</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    .active-pill {
      background-color: #6366f1 !important;
      color: #ffffff !important;
      border-color: #818cf8 !important;
    }

    /* Dynamic Multi-Column Schedule Grid */
    .schedule-matrix {
      display: grid;
      grid-template-columns: 80px repeat(5, minmax(220px, 1fr));
      gap: 12px;
    }

    @media (max-width: 1280px) {
      .schedule-matrix-container {
        overflow-x: auto;
      }
      .schedule-matrix {
        min-width: 1200px;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-900 text-slate-100 antialiased">

  <!-- Header -->
  <header class="bg-slate-800/90 border-b border-slate-700/80 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        
        <!-- Brand Title -->
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center font-black text-xl text-white shadow-lg">
            V
          </div>
          <div>
            <h1 class="text-xl font-bold text-white">
              VIEW Conference 2026
            </h1>
            <p class="text-xs text-slate-400">Official Interactive Event Schedule</p>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full md:w-80">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search talk, speaker, location..." 
            class="w-full bg-slate-900 text-sm text-slate-100 placeholder-slate-500 rounded-xl px-4 py-2.5 border border-slate-700 focus:outline-none focus:border-indigo-500 transition-all"
            oninput="handleFilterChange()"
          >
          <span class="absolute right-3.5 top-2.5 text-slate-500 text-sm">🔍</span>
        </div>

      </div>
    </div>

    <!-- Navigation & Filter Bar -->
    <div class="bg-slate-900/60 border-t border-slate-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col gap-3">
        
        <!-- Day Selector Tabs -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-1 text-xs font-semibold">
          <button onclick="setDateFilter('2026-10-12')" id="date-2026-10-12" class="date-tab active-pill px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
            Mon Oct 12
          </button>
          <button onclick="setDateFilter('2026-10-13')" id="date-2026-10-13" class="date-tab px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
            Tue Oct 13
          </button>
          <button onclick="setDateFilter('2026-10-14')" id="date-2026-10-14" class="date-tab px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
            Wed Oct 14
          </button>
          <button onclick="setDateFilter('2026-10-15')" id="date-2026-10-15" class="date-tab px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
            Thu Oct 15
          </button>
          <button onclick="setDateFilter('2026-10-16')" id="date-2026-10-16" class="date-tab px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
            Fri Oct 16
          </button>
        </div>

        <!-- Controls & Track Filters -->
        <div class="flex flex-wrap items-center justify-between gap-3 text-xs">
          
          <div class="flex items-center space-x-2 overflow-x-auto">
            <span class="text-slate-400 font-medium mr-1">Track:</span>
            <button onclick="setTrackFilter('all')" id="track-all" class="track-pill active-pill px-3 py-1 rounded-full border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
              All Tracks
            </button>
            <button onclick="setTrackFilter('Keynote')" id="track-Keynote" class="track-pill px-3 py-1 rounded-full border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
              Keynotes
            </button>
            <button onclick="setTrackFilter('VFX')" id="track-VFX" class="track-pill px-3 py-1 rounded-full border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
              VFX
            </button>
            <button onclick="setTrackFilter('Animation')" id="track-Animation" class="track-pill px-3 py-1 rounded-full border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
              Animation
            </button>
            <button onclick="setTrackFilter('AI & Tech')" id="track-AI & Tech" class="track-pill px-3 py-1 rounded-full border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">
              AI & Tech
            </button>
          </div>

          <!-- Favorites Toggle -->
          <button 
            id="starred-toggle" 
            onclick="toggleStarredOnly()" 
            class="px-3 py-1 rounded-full border border-amber-500/40 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 font-medium flex items-center gap-1.5 transition-all"
          >
            <span>⭐ Starred Sessions</span>
            <span id="starred-count" class="bg-amber-500 text-slate-900 text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span>
          </button>

        </div>

      </div>
    </div>
  </header>

  <!-- Main Schedule Board -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    
    <div class="flex items-center justify-between mb-4 text-sm text-slate-400">
      <div id="results-count">Loading schedule...</div>
    </div>

    <div class="schedule-matrix-container bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl">
      <div id="schedule-board" class="min-w-full">
        <!-- Rendered matrix layout inserts here -->
      </div>
    </div>

  </main>

  <footer class="bg-slate-800/40 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    VIEW Conference Calendar • Built for GitHub Pages
  </footer>

  <script>
    const TARGET_LOCATIONS = [
      "OGR - FUCINE",
      "OGR - BINARIO3",
      "OGR - MEZZANINO",
      "OGR - SOPPALCO",
      "OGR - CINEMA MASSIMO"
    ];

    let eventsData = [];
    let activeDate = '2026-10-12';
    let activeTrack = 'all';
    let showStarredOnly = false;
    let starredEvents = JSON.parse(localStorage.getItem('view_starred_events') || '[]');

    function normalizeLocation(locStr) {
      if (!locStr) return '';
      const cleanStr = locStr.toUpperCase().trim();
      for (const loc of TARGET_LOCATIONS) {
        const shortName = loc.replace('OGR - ', '');
        if (cleanStr.includes(shortName) || cleanStr === loc) {
          return loc;
        }
      }
      return locStr;
    }

    async function loadSchedule() {
      try {
        const response = await fetch('./schedule.json?v=' + Date.now());
        if (!response.ok) throw new Error(`Server status ${response.status}`);
        eventsData = await response.json();
        updateStarredBadge();
        handleFilterChange();
      } catch (err) {
        console.warn("Fetch failed:", err);
        const board = document.getElementById('schedule-board');
        if (board) {
          board.innerHTML = `
            <div class="p-8 rounded-xl bg-amber-900/30 border border-amber-700 text-center text-amber-200">
              <h3 class="font-bold text-lg mb-2">Unable to load event data</h3>
              <p class="text-xs text-amber-300 max-w-md mx-auto">
                Please verify that <code>schedule.json</code> is accessible in your repo directory.
              </p>
            </div>
          `;
        }
      }
    }

    function setDateFilter(date) {
      activeDate = date;
      document.querySelectorAll('.date-tab').forEach(el => el.classList.remove('active-pill'));
      const activeEl = document.getElementById(`date-${date}`);
      if (activeEl) activeEl.classList.add('active-pill');
      handleFilterChange();
    }

    function setTrackFilter(track) {
      activeTrack = track;
      document.querySelectorAll('.track-pill').forEach(el => el.classList.remove('active-pill'));
      const activeEl = document.getElementById(`track-${track}`);
      if (activeEl) activeEl.classList.add('active-pill');
      handleFilterChange();
    }

    function toggleStarredOnly() {
      showStarredOnly = !showStarredOnly;
      const btn = document.getElementById('starred-toggle');
      if (showStarredOnly) {
        btn.classList.add('bg-amber-500', 'text-slate-900');
        btn.classList.remove('bg-amber-500/10', 'text-amber-300');
      } else {
        btn.classList.remove('bg-amber-500', 'text-slate-900');
        btn.classList.add('bg-amber-500/10', 'text-amber-300');
      }
      handleFilterChange();
    }

    function toggleStar(eventId, event) {
      if (event) event.stopPropagation();
      const index = starredEvents.indexOf(eventId);
      if (index > -1) {
        starredEvents.splice(index, 1);
      } else {
        starredEvents.push(eventId);
      }
      localStorage.setItem('view_starred_events', JSON.stringify(starredEvents));
      updateStarredBadge();
      handleFilterChange();
    }

    function updateStarredBadge() {
      const badge = document.getElementById('starred-count');
      if (badge) badge.textContent = starredEvents.length;
    }

    function shareSession(title, url, event) {
      if (event) event.stopPropagation();
      if (navigator.share) {
        navigator.share({
          title: title,
          text: `Check out "${title}" at VIEW Conference 2026!`,
          url: url || window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url || window.location.href);
        alert('Session link copied to clipboard!');
      }
    }

    function handleFilterChange() {
      const query = (document.getElementById('search-input')?.value || '').toLowerCase().trim();

      const filtered = eventsData.filter(evt => {
        const matchDate = (evt.date === activeDate);
        const matchTrack = (activeTrack === 'all') || (evt.track === activeTrack);
        const matchStarred = !showStarredOnly || starredEvents.includes(evt.id || evt.title);
        const matchSearch = !query || 
          (evt.title && evt.title.toLowerCase().includes(query)) ||
          (evt.speaker && evt.speaker.toLowerCase().includes(query)) ||
          (evt.location && evt.location.toLowerCase().includes(query));

        return matchDate && matchTrack && matchStarred && matchSearch;
      });

      renderScheduleMatrix(filtered);
    }

    function renderScheduleMatrix(events) {
      const board = document.getElementById('schedule-board');
      const countEl = document.getElementById('results-count');

      if (countEl) {
        countEl.textContent = `Showing ${events.length} session${events.length === 1 ? '' : 's'} for ${activeDate}`;
      }

      if (!board) return;

      if (events.length === 0) {
        board.innerHTML = `
          <div class="py-16 text-center text-slate-500">
            No events found matching your filter options for this date.
          </div>
        `;
        return;
      }

      // Chronological time slots
      const timeSlots = Array.from(new Set(events.map(e => e.startTime))).sort();

      // Render Matrix Header
      let matrixHTML = `
        <div class="schedule-matrix mb-3 border-b border-slate-800 pb-3 font-semibold text-xs text-slate-400">
          <div class="flex items-center justify-center font-bold">Time</div>
          ${TARGET_LOCATIONS.map(loc => `<div class="text-center text-indigo-400 font-bold uppercase tracking-wider">${loc.replace('OGR - ', '')}</div>`).join('')}
        </div>
      `;

      // Render Matrix Rows
      timeSlots.forEach(time => {
        matrixHTML += `
          <div class="schedule-matrix border-b border-slate-800/50 py-3 items-start">
            <!-- Time Slot Column -->
            <div class="text-xs font-bold text-slate-300 pt-2 text-center bg-slate-800/60 py-2 rounded-lg border border-slate-700/60 shadow">
              ${time}
            </div>

            <!-- Location Columns -->
            ${TARGET_LOCATIONS.map(loc => {
              const matchingEvents = events.filter(e => e.startTime === time && normalizeLocation(e.location) === loc);
              
              if (matchingEvents.length === 0) {
                return `<div class="min-h-[90px] border border-dashed border-slate-800/40 rounded-xl"></div>`;
              }

              return `
                <div class="flex flex-col gap-2">
                  ${matchingEvents.map(evt => {
                    const isStarred = starredEvents.includes(evt.id || evt.title);
                    return `
                      <div class="bg-slate-800/90 rounded-xl border border-slate-700/80 p-3 flex flex-col justify-between shadow-lg hover:border-indigo-500/80 transition-all group relative">
                        <div>
                          <div class="flex items-center justify-between gap-1 mb-2">
                            <span class="text-[10px] font-bold text-indigo-300 bg-indigo-950/80 px-2 py-0.5 rounded-md border border-indigo-800/50">
                              ${evt.track || 'Session'}
                            </span>

                            <div class="flex items-center gap-1">
                              <button 
                                onclick="shareSession('${evt.title.replace(/'/g, "\\'")}', '${evt.url || ''}', event)"
                                class="text-slate-400 hover:text-white p-1 rounded hover:bg-slate-700/50 transition-colors"
                                title="Share Session"
                              >
                                🔗
                              </button>
                              <button 
                                onclick="toggleStar('${evt.id || evt.title.replace(/'/g, "\\'")}', event)"
                                class="p-1 text-sm transition-transform active:scale-125"
                                title="Favorite Session"
                              >
                                ${isStarred ? '⭐' : '☆'}
                              </button>
                            </div>
                          </div>

                          <h4 class="text-xs font-bold text-slate-100 group-hover:text-indigo-300 transition-colors leading-snug mb-1">
                            ${evt.title}
                          </h4>

                          <p class="text-[11px] text-slate-400 font-medium mb-2">
                            👤 ${evt.speaker || 'TBA'}
                          </p>
                        </div>

                        <div class="pt-2 border-t border-slate-700/50 flex items-center justify-between text-[10px] text-slate-400">
                          <span>⏰ ${evt.startTime} - ${evt.endTime || ''}</span>
                          ${evt.url ? `<a href="${evt.url}" target="_blank" rel="noopener noreferrer" class="text-indigo-400 hover:text-indigo-300 font-semibold">Details →</a>` : ''}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `;
            }).join('')}
          </div>
        `;
      });

      board.innerHTML = matrixHTML;
    }

    document.addEventListener('DOMContentLoaded', loadSchedule);
  </script>
</body>
</html>
